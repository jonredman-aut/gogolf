<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoGolf</title>
<meta name="theme-color" content="#1E4A34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GoGolf">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --ink:#13233A; --muted:#5A6777; --line:#D6DCE0;
  --frame:#1E4A34; --frame-2:#173B29; --frame-ink:#FFFFFF;
  --tile:#FFFFFF; --tile-ink:#13233A; --tile-under:#C4122F; --tile-over:#1E6B3A;
  --under:#C4122F; --over:#1E6B3A; --accent:#1E4A34; --accent-ink:#FFFFFF;
  --sand:#E9E4D5; --focus:#2F6FDB;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1813; --surface:#16241C; --ink:#E6EEE8; --muted:#9DB0A5; --line:#2A3C32;
    --frame:#24583F; --frame-2:#1B4631; --under:#FF6B7C; --over:#62C48F;
    --accent:#3D8A61; --sand:#1E2D25; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1813; --surface:#16241C; --ink:#E6EEE8; --muted:#9DB0A5; --line:#2A3C32;
  --frame:#24583F; --frame-2:#1B4631; --under:#FF6B7C; --over:#62C48F;
  --accent:#3D8A61; --sand:#1E2D25; --focus:#7FB0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
img{max-width:100%}

/* chrome */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--frame);color:var(--frame-ink)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.top-round{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;opacity:.9}
.chip-code{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:2px;background:var(--tile);color:var(--tile-ink);padding:2px 8px;border-radius:3px}
.banner{max-width:680px;margin:12px auto 0;padding:10px 14px;border-radius:10px;background:var(--sand);font-size:14px;color:var(--ink)}
main{max-width:680px;margin:0 auto;padding:16px 16px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* type */
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
h1{font-size:38px}
h2{font-size:26px}
h3{font-size:20px;font-weight:600}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack>*+*{margin-top:14px}
.section{margin-top:28px}

/* surfaces + controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel{margin-top:14px}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.inp.code{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:6px;text-transform:uppercase;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--under);border-color:color-mix(in srgb,var(--under) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:22px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* the board: physical leaderboard tiles */
.board{background:var(--frame);border-radius:6px;padding:14px 12px 16px;color:var(--frame-ink);box-shadow:inset 0 0 0 4px var(--frame-2)}
.board-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.board-title{font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:1px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#FF4D5E;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.bcols,.brow{display:grid;grid-template-columns:44px 1fr 64px 48px;gap:5px;align-items:stretch}
.bcols{font-size:13px;opacity:.85;padding:0 0 6px}
.bcols span:nth-child(n+3){text-align:center}
.brow{width:100%;background:none;border:0;padding:0;margin-top:5px;color:inherit;text-align:left}
.tile{background:var(--tile);color:var(--tile-ink);font-family:var(--cond);font-weight:700;font-size:24px;line-height:1;padding:9px 6px 8px;border-radius:2px;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.tile.name{text-align:left;padding-left:10px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.under{color:var(--tile-under)} .tile.over{color:var(--tile-over)}
.tile.blank{color:#9AA3AE}
.brow[aria-expanded="true"] .tile{box-shadow:inset 0 -2px 0 rgba(0,0,0,.12),0 0 0 2px #F7D46A}
.bcard{background:var(--tile);color:var(--tile-ink);border-radius:2px;margin-top:5px;padding:10px}
.board-empty{background:var(--tile);color:var(--tile-ink);border-radius:2px;padding:18px;text-align:center}
.meta-line{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;opacity:.9;padding:10px 4px 0}

/* code tiles */
.codewrap{background:var(--frame);border-radius:6px;padding:18px 14px;text-align:center;color:var(--frame-ink);box-shadow:inset 0 0 0 4px var(--frame-2)}
.codetiles{display:flex;justify-content:center;gap:6px;margin:10px 0 6px;user-select:all;-webkit-user-select:all}
.codetiles .tile{font-size:44px;width:52px;padding:12px 0 10px}
.codewrap p{margin:0;font-size:14px;opacity:.9}

/* scorecard */
.scwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sc{border-collapse:collapse;font-family:var(--cond);font-size:17px;min-width:100%}
.sc th,.sc td{border:1px solid #CBD2D8;padding:5px 0;min-width:30px;text-align:center}
.sc th{font-weight:600;background:#EEF1F3}
.sc th.lbl,.sc td.lbl{text-align:left;padding:5px 8px;min-width:54px;font-weight:600;background:#EEF1F3}
.sc .tot{background:#E3E8EC;font-weight:700}
.sc .cur{background:#FFF3C8}
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-weight:700}
.mk.birdie{border:1.5px solid var(--tile-under);border-radius:50%;color:var(--tile-under)}
.mk.eagle{border:1.5px solid var(--tile-under);border-radius:50%;color:var(--tile-under);box-shadow:0 0 0 2px var(--tile),0 0 0 3.5px var(--tile-under)}
.mk.bogey{border:1.5px solid var(--tile-ink)}
.mk.dbl{border:1.5px solid var(--tile-ink);box-shadow:0 0 0 2px var(--tile),0 0 0 3.5px var(--tile-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .mk{width:18px;height:18px;font-size:12px;background:var(--tile)}

/* scoring */
.pchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.pchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pchip small{font-weight:500;opacity:.8}
.holecard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hc-top{background:var(--frame);color:var(--frame-ink);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:14px 18px;align-items:end}
.hc-num{font-family:var(--cond);font-weight:700;font-size:72px;line-height:.85;grid-row:span 2}
.hc-num small{display:block;font-size:15px;font-weight:600;letter-spacing:.5px;opacity:.85;margin-bottom:4px;font-family:var(--body)}
.hc-facts{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.hc-facts b{font-family:var(--cond);font-size:26px;display:block;line-height:1}
.stepper{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:10px;padding:22px 18px 8px}
.stepbtn{height:76px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-size:38px;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center}
.stepbtn:active{transform:scale(.96)}
.bignum{text-align:center;font-family:var(--cond);font-weight:700;font-size:104px;line-height:.9}
.bignum.empty{color:var(--line)}
.bignum.under{color:var(--under)}
.verdict{text-align:center;min-height:26px;font-weight:600;color:var(--muted);padding-bottom:4px}
.hc-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:12px 18px 18px;align-items:center}
.holegrid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:14px}
.hg{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--cond);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.hg.done{background:var(--sand)}
.hg[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hg .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* courses */
.clist{list-style:none;margin:0;padding:0}
.citem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:10px}
.citem h3{font-size:22px}
.cpar{grid-row:span 2;align-self:center;text-align:right;font-family:var(--cond);font-weight:700;font-size:28px;line-height:1}
.cpar small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--cond);font-size:30px;display:block;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
table.holes{width:100%;border-collapse:collapse;font-size:15px}
.holes th{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.holes th:first-child,.holes td:first-child{text-align:left}
.holes td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.holes tr.sum td{font-weight:700;background:var(--sand)}
.hrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:8px;align-items:center;margin-top:6px}
.hrow .inp{padding:9px 10px;font-size:16px}
.hrow.h{font-size:13px;color:var(--muted);font-weight:600}
.hrow b{font-family:var(--cond);font-size:20px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.plist{list-style:none;padding:0;margin:0}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:600;background:var(--sand);padding:2px 8px;border-radius:999px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0 12px;color:var(--accent);font-weight:600}
.empty{text-align:center;padding:30px 18px}
.empty svg{width:48px;height:48px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:15px;max-width:min(92vw,520px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.codetiles .tile{font-size:34px;width:42px}.bcols,.brow{grid-template-columns:38px 1fr 56px 42px}.tile{font-size:21px}}
</style>
<script>
/* Shows a clear message instead of a stuck "Loading" screen if anything breaks. */
window.ggFail = function (title, detail) {
  function show() {
    var m = document.getElementById("main"); if (!m) return;
    m.innerHTML = '<div class="panel stack"><h2></h2><p></p><p class="muted small"></p></div>';
    m.querySelector("h2").textContent = title;
    m.querySelector("p").textContent = detail;
    m.querySelector(".small").textContent = "After fixing it, upload the new index.html to GitHub and reload this page.";
  }
  if (document.getElementById("main")) show(); else document.addEventListener("DOMContentLoaded", show);
};
window.addEventListener("unhandledrejection", function (e) {
  if (!window.ggStarted) window.ggFail("GoGolf couldn't start", String((e.reason && (e.reason.code || e.reason.message)) || e.reason));
});
setTimeout(function () {
  if (!window.ggStarted) window.ggFail("GoGolf is taking too long to start",
    "It couldn't reach Firebase. Check your internet connection, then reload. If this keeps happening, tell Claude this message says version 3.");
}, 25000);
window.addEventListener("error", function (e) {
  var msg = String(e.message || "");
  if (/syntax|unexpected|invalid|unterminated/i.test(msg)) {
    window.ggFail("There's a typo in index.html",
      "Something in the FIREBASE_CONFIG section can't be read (" + msg + "). The usual causes are curly quotes (“like this”) instead of straight quotes (\"like this\"), a missing comma at the end of a line, or pasting the whole 'const firebaseConfig = {' line inside the brackets.");
  } else if (!window.ggStarted) {
    window.ggFail("GoGolf couldn't start", msg);
  }
});
</script>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = p => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const CODE_CHARS = "ACDEFGHJKMNPQRTUVWXY34679";
const newCode = () => Array.from({length:5}, () => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
const normCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem("gogolf:" + k)); } catch { return null; } },

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3600); }
const fmtPar = n => n === 0 ? "E" : (n > 0 ? "+" + n : String(n));
const parClass = n => n < 0 ? "under" : (n > 0 ? "over" : "");
const STD_PARS = [4,4,3,5,4,4,3,4,5, 4,3,5,4,4,3,4,5,4];
const STD_HCP  = [7,3,15,1,11,5,17,9,13, 8,16,2,10,6,18,12,4,14];
const VERDICT = {"-3":"Albatross","-2":"Eagle","-1":"Birdie","0":"Par","1":"Bogey","2":"Double bogey","3":"Triple bogey"};
function markClass(v, par){ const d = v - par; return d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 1 ? "bogey" : d >= 2 ? "dbl" : ""; }

/* ---------- stores ---------- */
function liveStore(db){
  const chains = {};
  const serial = (key, fn) => { const p = (chains[key] || Promise.resolve()).then(fn, fn); chains[key] = p.catch(() => {}); return p; };
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    mode: "live",
    watchCourses(cb, err){ return db.collection("courses").onSnapshot(s => cb(rows(s)), err); },
    saveCourse(id, data){ return serial("courses/" + id, () => db.doc("courses/" + id).set(data)); },
    deleteCourse(id){ return serial("courses/" + id, () => db.doc("courses/" + id).delete()); },
    async getRound(code){ const s = await db.doc("rounds/" + code).get(); return s.exists ? s.data() : null; },
    createRound(code, data){ return db.doc("rounds/" + code).set(data); },
    watchRound(code, cb, err){ return db.doc("rounds/" + code).onSnapshot(s => { if (!s.exists && s.metadata && s.metadata.fromCache) return; cb(s.exists ? s.data() : null); }, err); },
    watchPlayers(code, cb, err){ return db.collection("rounds/" + code + "/players").onSnapshot(s => cb(rows(s)), err); },
    addPlayer(code, id, data){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).set(data)); },
    removePlayer(code, id){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).delete()); },
    setScore(code, id, hole, val){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).update({ ["scores." + hole]: val })); }
  };
}
function localStore(){
  const data = new Map(), subs = new Set();
  const clone = v => JSON.parse(JSON.stringify(v));
  const emit = () => subs.forEach(f => f());
  const watch = fn => { subs.add(fn); setTimeout(fn, 0); return () => subs.delete(fn); };
  const coll = prefix => [...data].filter(([k]) => k.startsWith(prefix + "/") && !k.slice(prefix.length + 1).includes("/"))
                                   .map(([k, v]) => ({ id: k.split("/").pop(), ...clone(v) }));
  return {
    mode: "local",
    watchCourses(cb){ return watch(() => cb(coll("courses"))); },
    async saveCourse(id, d){ data.set("courses/" + id, clone(d)); emit(); },
    async deleteCourse(id){ data.delete("courses/" + id); emit(); },
    async getRound(code){ const r = data.get("rounds/" + code); return r ? clone(r) : null; },
    async createRound(code, d){ data.set("rounds/" + code, clone(d)); emit(); },
    watchRound(code, cb){ return watch(() => { const r = data.get("rounds/" + code); cb(r ? clone(r) : null); }); },
    watchPlayers(code, cb){ return watch(() => cb(coll("rounds/" + code + "/players"))); },
    async addPlayer(code, id, d){ data.set("rounds/" + code + "/players/" + id, clone(d)); emit(); },
    async removePlayer(code, id){ data.delete("rounds/" + code + "/players/" + id); emit(); },
    async setScore(code, id, hole, val){ const p = data.get("rounds/" + code + "/players/" + id); if (p){ p.scores = { ...(p.scores || {}), [hole]: val }; emit(); } }
  };
}

/* ---------- state ---------- */
const S = {
  tab: "round", courses: [], coursesLoaded: false,
  code: null, round: undefined, players: [], me: null,
  scorer: null, hole: 1, courseView: null, draft: null,
  expanded: null, readOnly: false, pending: {}, armed: null
};
let store = null, unsubs = [];

function onDbError(e){
  const code = e && e.code;
  if (code === "permission-denied" || code === "failed-precondition" || code === "not-found"){
    S.coursesLoaded = true;
    SETUP_MSG = code === "permission-denied"
      ? "Firebase blocked access to the database. Paste firestore.rules into Firestore Database > Rules and click Publish."
      : "The Firestore database isn't set up. In Firebase, open Build > Firestore Database and click Create database.";
    render(); return;
  }
  if (code === "revoked" || code === "not_granted"){ S.readOnly = true; render(); }
  else if (code === "resource_exhausted") toast("Too many updates at once. Give it a moment and it will catch up.");
}
function onWriteError(e){
  let code = e && e.code;
  if (code === "permission-denied") code = "invalid_argument";
  if (code === "resource-exhausted") code = "quota_exceeded";
  if (code === "invalid_argument"){ S.readOnly = true; toast("That change was blocked by the server. Reload GoGolf and try again."); render(); }
  else if (code === "quota_exceeded") toast("GoGolf's database is over its limit. Check your Firebase plan.");
  else toast("That didn't save. Check your connection and try again.");
}
const guard = () => { if (S.readOnly){ toast("GoGolf can't save changes right now. Reload and try again."); return false; } return true; };

/* ---------- round lifecycle ---------- */
function stopWatching(){ unsubs.forEach(u => { try { u(); } catch {} }); unsubs = []; }
function watchRound(code){
  stopWatching();
  S.round = undefined; S.players = [];
  unsubs.push(store.watchRound(code, r => {
    if (r === null && S.code === code){ toast("Round " + code + " no longer exists."); leaveRound(true); return; }
    S.round = r; render();
  }, onDbError));
  unsubs.push(store.watchPlayers(code, list => {
    S.players = list.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    if (!S.scorer || !S.players.some(p => p.id === S.scorer)) S.scorer = (S.players.find(p => p.id === S.me) || S.players[0] || {}).id || null;
    render();
  }, onDbError));
}
function setActive(code, me){
  S.code = code; S.me = me; S.hole = 1; S.scorer = me;
  ls.set("active", { code, me, mode: store.mode });
  watchRound(code);
}
function leaveRound(silent){
  stopWatching();
  S.code = null; S.round = undefined; S.players = []; S.me = null; S.scorer = null;
  ls.del("active"); S.tab = "round"; render();
  if (!silent) toast("You left the round. Your scores are still on the leaderboard.");
}

/* ---------- scoring math ---------- */
function scoreOf(p, hole){
  const k = p.id + ":" + hole;
  if (k in S.pending) return S.pending[k];
  const v = p.scores && p.scores[hole];
  return typeof v === "number" ? v : null;
}
function summary(p, holes){
  let thru = 0, strokes = 0, par = 0;
  holes.forEach((h, i) => { const v = scoreOf(p, i + 1); if (v != null){ thru++; strokes += v; par += h.par; } });
  return { ...p, thru, strokes, toPar: strokes - par };
}
function standings(){
  if (!S.round) return [];
  const holes = S.round.holes;
  const list = S.players.map(p => summary(p, holes))
    .sort((a, b) => (a.thru === 0) - (b.thru === 0) || a.toPar - b.toPar || b.thru - a.thru || String(a.name).localeCompare(String(b.name)));
  const started = list.filter(p => p.thru > 0);
  list.forEach(p => {
    if (!p.thru){ p.pos = "–"; return; }
    const better = started.filter(q => q.toPar < p.toPar).length;
    const tied = started.filter(q => q.toPar === p.toPar).length > 1;
    p.pos = (tied ? "T" : "") + (better + 1);
  });
  return list;
}
const writeTimers = {};
function setScore(pid, hole, val){
  if (!guard()) return;
  const k = pid + ":" + hole;
  S.pending[k] = val; render();
  clearTimeout(writeTimers[k]);
  writeTimers[k] = setTimeout(() => {
    const v = S.pending[k];
    store.setScore(S.code, pid, String(hole), v)
      .then(() => { if (S.pending[k] === v) delete S.pending[k]; render(); })
      .catch(e => { delete S.pending[k]; onWriteError(e); render(); });
  }, 400);
}

function scorecardHTML(p, holes, cur){

        <button class="btn" data-act="hole" data-v="${S.hole - 1}" ${S.hole === 1 ? "disabled" : ""}>‹ Hole ${Math.max(1, S.hole - 1)}</button>
        ${v != null && !S.readOnly ? `<button class="link" data-act="clear">Clear</button>` : "<span></span>"}
        <button class="btn ${v != null ? "primary" : ""}" data-act="hole" data-v="${S.hole + 1}" ${S.hole === n ? "disabled" : ""}>Hole ${Math.min(n, S.hole + 1)} ›</button>
      </div>
    </div>
    <div class="holegrid" role="group" aria-label="Jump to hole">${holes.map((_, i) => { const s = scoreOf(p, i + 1); return `<button class="hg ${s != null ? "done" : ""}" data-act="hole" data-v="${i + 1}" aria-current="${S.hole === i + 1}" aria-label="Hole ${i + 1}${s != null ? ", scored " + s : ""}">${i + 1}${s != null ? '<span class="dot"></span>' : ""}</button>`; }).join("")}</div>
    <div class="section"><h3 style="margin-bottom:8px">${esc(p.name)}'s card</h3>
      <div class="panel" style="padding:10px;background:#fff;color:#13233A">${scorecardHTML(p, holes, S.hole)}</div>${LEGEND}</div>
  </div>`;
}

function viewBoard(){
  if (!S.code) return needRound("board");
  if (!S.round) return `<p class="muted">Loading leaderboard…</p>`;
  const list = standings(), holes = S.round.holes;
  const totalPar = holes.reduce((s, h) => s + h.par, 0);
  return `<div class="board" role="region" aria-label="Leaderboard">
    <div class="board-head"><span class="board-title">Leaders</span><span class="live"><i aria-hidden="true"></i>Live</span></div>
    ${list.length ? `<div class="bcols" aria-hidden="true"><span>Pos</span><span>Player</span><span>To par</span><span>Thru</span></div>
    ${list.map(p => `<button class="brow" data-act="expand" data-v="${esc(p.id)}" aria-expanded="${S.expanded === p.id}" aria-label="${esc(p.name)}, ${p.thru ? "position " + p.pos + ", " + fmtPar(p.toPar) + " through " + p.thru : "not started"}">
        <span class="tile ${p.thru ? "" : "blank"}">${esc(p.pos)}</span>
        <span class="tile name">${esc(p.name)}</span>
        <span class="tile ${p.thru ? parClass(p.toPar) : "blank"}">${p.thru ? fmtPar(p.toPar) : "–"}</span>
        <span class="tile ${p.thru ? "" : "blank"}">${p.thru === holes.length ? "F" : p.thru || "–"}</span>
      </button>
      ${S.expanded === p.id ? `<div class="bcard">${scorecardHTML(p, holes)}<div class="small" style="margin-top:8px">${p.thru ? `${p.strokes} strokes through ${p.thru}` : "No scores yet"}</div></div>` : ""}`).join("")}`
    : `<div class="board-empty">Nobody has joined yet. Share code <b>${esc(S.code)}</b> to fill the board.</div>`}
    <div class="meta-line"><span>${esc(S.round.courseName)}</span><span>Par ${totalPar}</span><span>Tap a name for the scorecard</span></div>
  </div>
  <div class="legend" style="margin-top:12px"><span style="color:var(--under);font-weight:700">Red</span> under par <span style="color:var(--over);font-weight:700">Green</span> over par</div>`;
}

const VIEWS = { round: viewRound, courses: viewCourses, score: viewScore, board: viewBoard };
function render(){
  if (!store) return;
  const main = $("#main");
  const ae = document.activeElement, fid = ae && main.contains(ae) ? ae.id : null;
  let sel = null; try { sel = [ae.selectionStart, ae.selectionEnd]; } catch {}
  const keep = {}; main.querySelectorAll("[data-k]").forEach(el => { if (el.id) keep[el.id] = el.value; });
  const sx = window.scrollX, sy = window.scrollY;
  main.innerHTML = VIEWS[S.tab]();
  for (const id in keep){ const el = document.getElementById(id); if (el && keep[id] !== "" ) el.value = keep[id]; }
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({ preventScroll: true }); try { if (sel && sel[0] != null) el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  window.scrollTo(sx, sy);
  renderChrome();
}
function go(tab){ S.tab = tab; S.armed = null; render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
async function doJoin(follow){
  const code = normCode($("#jcode").value), name = $("#jname").value.trim();
  if (code.length < 4) return toast("Enter the sign-up code from your group.");
  if (!follow && !name) return toast("Enter your name so it shows on the leaderboard.");
  let r; try { r = await store.getRound(code); } catch { return toast("Couldn't reach GoGolf. Check your connection and try again."); }
  if (!r) return toast("No round found for " + code + ". Check the code and try again.");
  if (follow || S.readOnly){ setActive(code, null); go("board"); return; }
  const pid = rid("p");
  try { await store.addPlayer(code, pid, { name, scores: {}, joinedAt: Date.now() }); }
  catch (e) { onWriteError(e); setActive(code, null); go("board"); return; }
  setActive(code, pid); go("score"); toast("You're in. Good luck out there.");
}
async function doStart(){
  if (!guard()) return;
  const c = S.courses.find(x => x.id === $("#scourse").value), me = $("#sme").value.trim();
  const name = $("#sname").value.trim() || (c ? c.name + " round" : "Round");
  if (!c) return toast("Pick a course.");
  if (!me) return toast("Enter your name so it shows on the leaderboard.");
  let code = newCode();
  try { for (let i = 0; i < 4 && await store.getRound(code); i++) code = newCode(); } catch {}
  const pid = rid("p");
  try {
    await store.createRound(code, { name, courseId: c.id, courseName: c.name, tee: c.tee || "", holes: c.holes.map(h => ({ par: h.par, yds: h.yds ?? null, hcp: h.hcp ?? null })), createdAt: Date.now() });
    await store.addPlayer(code, pid, { name: me, scores: {}, joinedAt: Date.now() });
  } catch (e) { return onWriteError(e); }
  ["#sname", "#sme"].forEach(s => { const el = $(s); if (el) el.value = ""; });
  setActive(code, pid); toast("Round started. Share code " + code + " with your group.");
}
function saveDraft(){
  if (!guard()) return;
  const d = S.draft;
  if (!d.name.trim()) return toast("Give the course a name.");
  const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : null; };
  const data = { name: d.name.trim(), city: d.city.trim(), tee: d.tee.trim(), notes: d.notes.trim(),
    holes: d.holes.map(h => ({ par: +h.par || 4, yds: num(h.yds), hcp: num(h.hcp) })), updatedAt: Date.now() };
  const id = d.id;
  store.saveCourse(id, data).then(() => { toast("Saved " + data.name + "."); }).catch(onWriteError);
  S.draft = null; S.courseView = id; render(); window.scrollTo(0, 0);
}
async function copyCode(){
  const text = `Join my GoGolf round "${S.round?.name || ""}" with code ${S.code}`;
  try { await navigator.clipboard.writeText(S.code); toast("Code " + S.code + " copied."); }
  catch {
    const r = document.createRange(), el = $(".codetiles");
    if (el){ r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Press and hold the code to copy it.");
  }
  return text;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a !== "rmplayer" && a !== "delcourse") S.armed = null;
  switch (a){
    case "tab": go(v); break;
    case "join": doJoin(false); break;
    case "follow": doJoin(true); break;
    case "start": doStart(); break;
    case "copy": copyCode(); break;
    case "share": try { await navigator.share({ title: "GoGolf", text: `Join my GoGolf round "${S.round.name}" with code ${S.code}` }); } catch {} break;
    case "leave": leaveRound(false); break;
    case "addplayer": {
      if (!guard()) break;
      const el = $("#addname"), name = el.value.trim();
      if (!name) { toast("Type the player's name first."); break; }
      el.value = "";
      store.addPlayer(S.code, rid("p"), { name, scores: {}, joinedAt: Date.now() }).then(() => toast(name + " added.")).catch(onWriteError);
      break;
    }
    case "rmplayer":
      if (!guard()) break;
      if (S.armed === "rm:" + v){ S.armed = null; store.removePlayer(S.code, v).catch(onWriteError); if (v === S.me) S.me = null; }
      else { S.armed = "rm:" + v; render(); }
      break;
    case "scorer": S.scorer = v; render(); break;
    case "hole": S.hole = +v; render(); break;
    case "plus": case "minus": case "clear": {
      const p = S.players.find(x => x.id === S.scorer) || S.players[0]; if (!p) break;
      const par = S.round.holes[S.hole - 1].par, cur = scoreOf(p, S.hole);
      let nv = a === "clear" ? null : cur == null ? par : cur + (a === "plus" ? 1 : -1);
      if (nv != null) nv = Math.max(1, Math.min(15, nv));
      setScore(p.id, S.hole, nv);
      break;
    }
    case "expand": S.expanded = S.expanded === v ? null : v; render(); break;
    case "newcourse": if (!guard()) break; S.draft = { id: rid("c"), name: "", city: "", tee: "", notes: "", holes: blankHoles(18) }; S.tab = "courses"; render(); window.scrollTo(0, 0); break;
    case "editcourse": { const c = S.courses.find(x => x.id === v); if (!c) break;
      S.draft = { id: c.id, existing: true, name: c.name || "", city: c.city || "", tee: c.tee || "", notes: c.notes || "", holes: c.holes.map(h => ({ par: h.par, yds: h.yds ?? "", hcp: h.hcp ?? "" })) };
      render(); window.scrollTo(0, 0); break; }
    case "count": { const n = +v, cur = S.draft.holes;
      S.draft.holes = n > cur.length ? cur.concat(blankHoles(n).slice(cur.length)) : cur.slice(0, n); render(); break; }
    case "savecourse": saveDraft(); break;
    case "canceldraft": S.draft = null; render(); break;
    case "opencourse": S.courseView = v; render(); window.scrollTo(0, 0); break;
    case "courseback": S.courseView = null; render(); break;
    case "delcourse":
      if (!guard()) break;
      if (S.armed === "del:" + v){ S.armed = null; S.courseView = null; store.deleteCourse(v).then(() => toast("Course deleted.")).catch(onWriteError); render(); }
      else { S.armed = "del:" + v; render(); }
      break;
    case "playhere": S.tab = "round"; render(); { const sel = $("#scourse"); if (sel){ sel.value = v; $("#sname")?.focus(); } } break;
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.draft && S.draft){
    const f = el.dataset.draft;
    if (el.dataset.i != null){
      let val = el.value;
      if (f !== "par") val = val.replace(/\D/g, "");
      S.draft.holes[+el.dataset.i][f] = f === "par" ? +val : val;
      if (f === "par" || f === "yds") { const t = S.draft.holes.reduce((s, h) => s + (+h.par || 0), 0); const y = S.draft.holes.reduce((s, h) => s + (+h.yds || 0), 0);
        const span = document.querySelector(".panel .muted.small"); if (span) span.textContent = "Par " + t + (y ? ", " + y.toLocaleString() + " yds" : ""); }
    } else S.draft[f] = el.value;
  }
  if (el.id === "jcode"){ const pos = el.selectionStart; el.value = normCode(el.value); try { el.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const id = e.target.id;
  if (id === "jcode" || id === "jname") doJoin(false);
  else if (id === "addname") $('[data-act="addplayer"]')?.click();
  else if (id === "sme" || id === "sname") doStart();
});

/* ---------- boot ---------- */
let SETUP_MSG = "";
(async function boot(){
  let db = null;
  const configured = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE");
  const timeout = (p, ms, code) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code }), ms))]);
  const HELP = {
    "auth/admin-restricted-operation": "Anonymous sign-in is turned off. In Firebase, go to Authentication > Sign-in method and turn on Anonymous.",
    "auth/operation-not-allowed": "Anonymous sign-in is turned off. In Firebase, go to Authentication > Sign-in method and turn on Anonymous.",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "The apiKey in FIREBASE_CONFIG is wrong. Copy it again from Firebase Project settings.",
    "auth/invalid-api-key": "The apiKey in FIREBASE_CONFIG is wrong. Copy it again from Firebase Project settings.",
    "auth/unauthorized-domain": "Your Vercel address isn't on Firebase's list. Add it under Authentication > Settings > Authorized domains.",
    "auth/network-request-failed": "No connection to Firebase. Check your internet and reload.",
    "signin-timeout": "Firebase sign-in didn't answer. Check that Anonymous sign-in is on and your Vercel address is under Authorized domains."
  };
  if (configured && window.firebase){
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      await timeout(firebase.auth().signInAnonymously(), 12000, "signin-timeout");
      db = firebase.firestore();
      try { await timeout(db.enablePersistence({ synchronizeTabs: true }), 4000, "skip"); } catch {}
    } catch (e) {
      console.error(e); db = null;
      const code = (e && e.code) || (e && e.message) || "unknown";
      SETUP_MSG = "Couldn't connect to Firebase: " + (HELP[code] || code) + " Until it's fixed, scores stay on this device only.";
    }
  } else {
    SETUP_MSG = configured ? "Couldn't load the database library. Check your connection and reload." : "Setup needed: add your Firebase config to index.html. Until then, scores stay on this device only.";
  }
  window.ggStarted = true;
  store = db ? liveStore(db) : localStore();
  store.watchCourses(list => { S.courses = list.filter(c => Array.isArray(c.holes) && c.holes.length); S.coursesLoaded = true; render(); }, onDbError);
  const saved = ls.get("active");
  if (saved && saved.code && saved.mode === store.mode && store.mode === "live"){ S.code = saved.code; S.me = saved.me; S.scorer = saved.me; watchRound(saved.code); S.tab = "score"; }
  render();
})();
</script>
</body>
</html>
