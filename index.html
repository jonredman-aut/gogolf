<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedGOLF</title>
<meta name="theme-color" content="#1E4A34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RedGOLF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --ink:#13233A; --muted:#5A6777; --line:#D6DCE0;
  --frame:#1E4A34; --frame-2:#173B29; --frame-ink:#FFFFFF;
  --tile:#FFFFFF; --tile-ink:#13233A; --tile-under:#C4122F; --tile-over:#1E6B3A;
  --under:#C4122F; --over:#1E6B3A; --accent:#1E4A34; --accent-ink:#FFFFFF;
  --sand:#E9E4D5; --focus:#2F6FDB;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1813; --surface:#16241C; --ink:#E6EEE8; --muted:#9DB0A5; --line:#2A3C32;
    --frame:#24583F; --frame-2:#1B4631; --under:#FF6B7C; --over:#62C48F;
    --accent:#3D8A61; --sand:#1E2D25; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1813; --surface:#16241C; --ink:#E6EEE8; --muted:#9DB0A5; --line:#2A3C32;
  --frame:#24583F; --frame-2:#1B4631; --under:#FF6B7C; --over:#62C48F;
  --accent:#3D8A61; --sand:#1E2D25; --focus:#7FB0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
img{max-width:100%}

/* chrome */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--frame);color:var(--frame-ink)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.top-round{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;opacity:.9}
.chip-code{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:2px;background:var(--tile);color:var(--tile-ink);padding:2px 8px;border-radius:3px}
.banner{max-width:680px;margin:12px auto 0;padding:10px 14px;border-radius:10px;background:var(--sand);font-size:14px;color:var(--ink)}
main{max-width:680px;margin:0 auto;padding:16px 16px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* type */
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
h1{font-size:38px}
h2{font-size:26px}
h3{font-size:20px;font-weight:600}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack>*+*{margin-top:14px}
.section{margin-top:28px}

/* surfaces + controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel{margin-top:14px}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.inp.code{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:6px;text-transform:uppercase;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--under);border-color:color-mix(in srgb,var(--under) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:22px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* the board: physical leaderboard tiles */
.board{background:var(--frame);border-radius:6px;padding:14px 12px 16px;color:var(--frame-ink);box-shadow:inset 0 0 0 4px var(--frame-2)}
.board-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.board-title{font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:1px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#FF4D5E;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.bcols,.brow{display:grid;grid-template-columns:44px 1fr 64px 48px;gap:5px;align-items:stretch}
.bcols{font-size:13px;opacity:.85;padding:0 0 6px}
.bcols span:nth-child(n+3){text-align:center}
.brow{width:100%;background:none;border:0;padding:0;margin-top:5px;color:inherit;text-align:left}
.tile{background:var(--tile);color:var(--tile-ink);font-family:var(--cond);font-weight:700;font-size:24px;line-height:1;padding:9px 6px 8px;border-radius:2px;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.tile.name{text-align:left;padding-left:10px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.under{color:var(--tile-under)} .tile.over{color:var(--tile-over)}
.tile.blank{color:#9AA3AE}
.brow[aria-expanded="true"] .tile{box-shadow:inset 0 -2px 0 rgba(0,0,0,.12),0 0 0 2px #F7D46A}
.bcard{background:var(--tile);color:var(--tile-ink);border-radius:2px;margin-top:5px;padding:10px}
.board-empty{background:var(--tile);color:var(--tile-ink);border-radius:2px;padding:18px;text-align:center}
.meta-line{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;opacity:.9;padding:10px 4px 0}

/* code tiles */
.codewrap{background:var(--frame);border-radius:6px;padding:18px 14px;text-align:center;color:var(--frame-ink);box-shadow:inset 0 0 0 4px var(--frame-2)}
.codetiles{display:flex;justify-content:center;gap:6px;margin:10px 0 6px;user-select:all;-webkit-user-select:all}
.codetiles .tile{font-size:44px;width:52px;padding:12px 0 10px}
.codewrap p{margin:0;font-size:14px;opacity:.9}

/* scorecard */
.scwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sc{border-collapse:collapse;font-family:var(--cond);font-size:17px;min-width:100%}
.sc th,.sc td{border:1px solid #CBD2D8;padding:5px 0;min-width:30px;text-align:center}
.sc th{font-weight:600;background:#EEF1F3}
.sc th.lbl,.sc td.lbl{text-align:left;padding:5px 8px;min-width:54px;font-weight:600;background:#EEF1F3}
.sc .tot{background:#E3E8EC;font-weight:700}
.sc .cur{background:#FFF3C8}
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-weight:700}
.mk.birdie{border:1.5px solid var(--tile-under);border-radius:50%;color:var(--tile-under)}
.mk.eagle{border:1.5px solid var(--tile-under);border-radius:50%;color:var(--tile-under);box-shadow:0 0 0 2px var(--tile),0 0 0 3.5px var(--tile-under)}
.mk.bogey{border:1.5px solid var(--tile-ink)}
.mk.dbl{border:1.5px solid var(--tile-ink);box-shadow:0 0 0 2px var(--tile),0 0 0 3.5px var(--tile-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .mk{width:18px;height:18px;font-size:12px;background:var(--tile)}

/* scoring */
.pchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.pchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pchip small{font-weight:500;opacity:.8}
.holecard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hc-top{background:var(--frame);color:var(--frame-ink);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:14px 18px;align-items:end}
.hc-num{font-family:var(--cond);font-weight:700;font-size:72px;line-height:.85;grid-row:span 2}
.hc-num small{display:block;font-size:15px;font-weight:600;letter-spacing:.5px;opacity:.85;margin-bottom:4px;font-family:var(--body)}
.hc-facts{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.hc-facts b{font-family:var(--cond);font-size:26px;display:block;line-height:1}
.stepper{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:10px;padding:22px 18px 8px}
.stepbtn{height:76px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-size:38px;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center}
.stepbtn:active{transform:scale(.96)}
.bignum{text-align:center;font-family:var(--cond);font-weight:700;font-size:104px;line-height:.9}
.bignum.empty{color:var(--line)}
.bignum.under{color:var(--under)}
.verdict{text-align:center;min-height:26px;font-weight:600;color:var(--muted);padding-bottom:4px}
.hc-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:12px 18px 18px;align-items:center}
.holegrid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:14px}
.hg{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--cond);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.hg.done{background:var(--sand)}
.hg[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hg .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* courses */
.clist{list-style:none;margin:0;padding:0}
.citem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:10px}
.citem h3{font-size:22px}
.cpar{grid-row:span 2;align-self:center;text-align:right;font-family:var(--cond);font-weight:700;font-size:28px;line-height:1}
.cpar small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--cond);font-size:30px;display:block;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
table.holes{width:100%;border-collapse:collapse;font-size:15px}
.holes th{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.holes th:first-child,.holes td:first-child{text-align:left}
.holes td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.holes tr.sum td{font-weight:700;background:var(--sand)}
.hrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:8px;align-items:center;margin-top:6px}
.hrow .inp{padding:9px 10px;font-size:16px}
.hrow.h{font-size:13px;color:var(--muted);font-weight:600}
.hrow b{font-family:var(--cond);font-size:20px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.plist{list-style:none;padding:0;margin:0}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:600;background:var(--sand);padding:2px 8px;border-radius:999px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0 12px;color:var(--accent);font-weight:600}
.empty{text-align:center;padding:30px 18px}
.empty svg{width:48px;height:48px;color:var(--muted)}
.settings-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;font-size:26px;color:var(--accent)}
.settings-head h3{color:var(--ink)}
span.f{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.toggle input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
.toggle b{display:block}
.toggle small{display:block;color:var(--muted);font-size:14px}
.skinopts{margin-left:34px;display:grid;gap:12px}
.teamnames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.teamsel{width:auto;flex:0 0 auto;padding:6px 8px;font-size:15px;max-width:44%}
.putts{display:grid;grid-template-columns:auto 52px 56px 52px;justify-content:center;align-items:center;gap:10px;padding:6px 18px 4px}
.putts-l{font-weight:600;color:var(--muted);margin-right:6px}
.stepbtn.sm{height:52px;font-size:28px}
.putts-n{text-align:center;font-family:var(--cond);font-weight:700;font-size:40px;line-height:1}
.putts-n.empty{color:var(--line)}
.boardseg{display:flex;margin:0 0 10px;border-color:var(--frame-2)}
.boardseg button{flex:1;padding:8px 6px;background:var(--frame-2);color:var(--frame-ink)}
.boardseg button[aria-pressed="true"]{background:var(--tile);color:var(--tile-ink)}
.skincols,.skinrow{grid-template-columns:52px 1fr}
.skinrow{display:grid;gap:5px;margin-top:5px}
.money{font-style:normal;float:right;color:var(--tile-over)}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid #E1E5E8}
.mrow:last-child{border-bottom:0}
.mrow>span:first-child{white-space:nowrap}
.skinlist{margin-top:10px}
.under-ink{color:var(--tile-under)} .over-ink{color:var(--tile-over)}
.board-note{margin-top:8px;font-size:14px;opacity:.9;padding:0 4px}
.ttag{display:inline-block;font-size:13px;font-weight:600;background:var(--sand);color:var(--ink);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.seg.grid2{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.grid2 button:nth-child(-n+2){border-bottom:1.5px solid var(--line)}
.seg.grid2 button:nth-child(odd){border-right:1.5px solid var(--line)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.inp.mini{width:62px;flex:0 0 auto;padding:8px 6px;font-size:16px;text-align:center}
.inp.mini.wide{width:auto;max-width:44%}
.plist li.erow{gap:8px;padding:8px 0}
.enm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.enm small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flb{flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--cond);font-weight:700;font-size:19px;display:inline-flex;align-items:center;justify-content:center}
.flb.none{background:var(--sand);color:var(--muted)}
.xbtn{flex:0 0 auto;min-width:36px;height:36px;border:0;background:none;color:var(--under);font-weight:600;font-size:15px;border-radius:8px;padding:0 6px}
.xbtn.armed{background:color-mix(in srgb,var(--under) 12%,transparent)}
.tblock{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.thead{display:flex;align-items:center;gap:8px;min-height:36px}
.thead b{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:8px;margin-top:8px;align-items:center}
.addrow .inp:not(.mini){flex:1;min-width:0;padding:10px 12px;font-size:16px}
.addrow .btn{flex:0 0 auto;min-height:44px}
.scorerpick{margin-bottom:8px}
.subbars{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 10px}
.boardseg.sm{margin:0;flex:1 1 150px}
.boardseg.sm button{padding:6px 6px;font-size:14px}
.fhead{font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.5px;padding:14px 4px 6px}
.jgo{grid-row:span 2;align-self:center;font-weight:600;color:var(--accent);white-space:nowrap}
.flt{font-style:normal;float:right;font-size:16px;color:var(--frame);background:var(--sand);border-radius:3px;padding:0 6px;margin-left:6px}
.sc .pop{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--tile-under);vertical-align:top;margin-left:1px}
.sc tr.netrow td{color:var(--tile-over);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:15px;max-width:min(92vw,520px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.codetiles .tile{font-size:34px;width:42px}.bcols,.brow{grid-template-columns:38px 1fr 56px 42px}.tile{font-size:21px}}
</style>
<script>
/* Shows a clear message instead of a stuck "Loading" screen if anything breaks. */
window.ggFail = function (title, detail) {
  function show() {
    var m = document.getElementById("main"); if (!m) return;
    m.innerHTML = '<div class="panel stack"><h2></h2><p></p><p class="muted small"></p></div>';
    m.querySelector("h2").textContent = title;
    m.querySelector("p").textContent = detail;
    m.querySelector(".small").textContent = "After fixing it, upload the new index.html to GitHub and reload this page.";
  }
  if (document.getElementById("main")) show(); else document.addEventListener("DOMContentLoaded", show);
};
window.addEventListener("unhandledrejection", function (e) {
  if (!window.ggStarted) window.ggFail("RedGOLF couldn't start", String((e.reason && (e.reason.code || e.reason.message)) || e.reason));
});
setTimeout(function () {
  if (!window.ggStarted) window.ggFail("RedGOLF is taking too long to start",

function liveStore(db){
  const chains = {};
  const serial = (key, fn) => { const p = (chains[key] || Promise.resolve()).then(fn, fn); chains[key] = p.catch(() => {}); return p; };
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    mode: "live",
    watchCourses(cb, err){ return db.collection("courses").onSnapshot(s => cb(rows(s)), err); },
    saveCourse(id, data){ return serial("courses/" + id, () => db.doc("courses/" + id).set(data)); },
    deleteCourse(id){ return serial("courses/" + id, () => db.doc("courses/" + id).delete()); },
    async getRound(code){ const s = await db.doc("rounds/" + code).get(); return s.exists ? s.data() : null; },
    createRound(code, data){ return db.doc("rounds/" + code).set(data); },
    watchRound(code, cb, err){ return db.doc("rounds/" + code).onSnapshot(s => { if (!s.exists && s.metadata && s.metadata.fromCache) return; cb(s.exists ? s.data() : null); }, err); },
    watchPlayers(code, cb, err){ return db.collection("rounds/" + code + "/players").onSnapshot(s => cb(rows(s)), err); },
    addPlayer(code, id, data){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).set(data)); },
    removePlayer(code, id){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).delete()); },
    setScore(code, id, hole, val, field = "scores"){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).update({ [field + "." + hole]: val })); },
    setTeam(code, id, team){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).update({ team })); },
    updatePlayer(code, id, data){ const p = "rounds/" + code + "/players/" + id; return serial(p, () => db.doc(p).update(data)); },
    async getPlayers(code){ const s = await db.collection("rounds/" + code + "/players").get(); return rows(s); },
    updateRound(code, data){ const p = "rounds/" + code; return serial(p, () => db.doc(p).update(data)); }
  };
}
function localStore(){

  const coll = prefix => [...data].filter(([k]) => k.startsWith(prefix + "/") && !k.slice(prefix.length + 1).includes("/"))

    mode: "local",

    async getRound(code){ const r = data.get("rounds/" + code); return r ? clone(r) : null; },
    async createRound(code, d){ data.set("rounds/" + code, clone(d)); emit(); },
    watchRound(code, cb){ return watch(() => { const r = data.get("rounds/" + code); cb(r ? clone(r) : null); }); },
    watchPlayers(code, cb){ return watch(() => cb(coll("rounds/" + code + "/players"))); },

    async removePlayer(code, id){ data.delete("rounds/" + code + "/players/" + id); emit(); },

  const started = list.filter(p => p.thru > 0);
  list.forEach(p => {
    if (!p.thru){ p.pos = "–"; return; }
    const better = started.filter(q => q.toPar < p.toPar).length;
    const tied = started.filter(q => q.toPar === p.toPar).length > 1;
    p.pos = (tied ? "T" : "") + (better + 1);
  });
  return list;
}
function standings(){
  if (!S.round) return [];
  const holes = S.round.holes;
  return rank(S.players.map(p => {
    const s = summary(p, holes);
    s.putts = holes.reduce((t, _, i) => t + (puttsOf(p, i + 1) || 0), 0);
    return s;
  }));
}
function teamStandings(){
  const st = settings(), holes = S.round.holes, out = [];
  for (let t = 0; t < st.teamCount; t++){
    const members = S.players.filter(p => p.team === t);
    let thru = 0, strokes = 0, par = 0;
    holes.forEach((h, i) => {
      const vals = members.map(p => scoreOf(p, i + 1));
      if (st.format === "bestball"){
        const got = vals.filter(v => v != null);
        if (got.length){ thru++; strokes += Math.min(...got); par += h.par; }
      } else if (members.length && vals.every(v => v != null)){
        thru++; strokes += vals.reduce((a, b) => a + b, 0); par += h.par * members.length;
      }
    });
    out.push({ id: "t" + t, name: st.teamNames[t], members, thru, strokes, toPar: strokes - par });
  }
  return rank(out);
}
function skinsResult(basis = "gross"){
  const holes = S.round.holes, st = settings(), ps = S.players;
  const won = {}; ps.forEach(p => won[p.id] = 0);
  const rows = []; let pot = 1, stalled = false;
  holes.forEach((h, i) => {
    if (stalled){ rows.push({ hole: i + 1, status: "open", par: h.par }); return; }
    const vals = ps.map(p => ({ p, v: holeVal(p, i, basis) }));
    const missing = vals.filter(x => x.v == null).map(x => x.p.name);
    if (!ps.length || missing.length){ stalled = true; rows.push({ hole: i + 1, status: "wait", missing, pot, par: h.par }); return; }
    const min = Math.min(...vals.map(x => x.v)), low = vals.filter(x => x.v === min);
    if (low.length === 1){ won[low[0].p.id] += pot; rows.push({ hole: i + 1, status: "won", winner: low[0].p, score: min, pot, par: h.par }); pot = 1; }
    else { rows.push({ hole: i + 1, status: "tie", score: min, pot, par: h.par, tied: low.length }); pot = st.carry ? pot + 1 : 1; }
  });
  return { rows, won, pot };
}
const writeTimers = {};
function setScore(pid, hole, val, field = "scores"){
  if (!guard()) return;
  const k = (field === "putts" ? "pt:" : "") + pid + ":" + hole;
  S.pending[k] = val; render();
  clearTimeout(writeTimers[k]);
  writeTimers[k] = setTimeout(() => {
    const v = S.pending[k];
    store.setScore(S.code, pid, String(hole), v, field)
      .then(() => { if (S.pending[k] === v) delete S.pending[k]; render(); })
      .catch(e => { delete S.pending[k]; onWriteError(e); render(); });
  }, 400);
}
function saveSettings(patch){
  if (!guard()) return;
  const next = { ...settings(), ...patch };
  S.round = { ...S.round, settings: next }; render();
  store.updateRound(S.code, { settings: next }).catch(onWriteError);
}

/* ---------- tournament engine ---------- */
const T_FORMATS = { individual: "Individual stroke play", scramble: "Scramble", bestball: "Best ball", aggregate: "Team total" };
const T_SHORT = { individual: "Individual", scramble: "Scramble", bestball: "Best ball", aggregate: "Team total" };
const T_HINT = {
  individual: "Everyone plays their own ball and posts their own score.",
  scramble: "Each team plays the best shot and posts one score per hole, so each team is one scorecard.",
  bestball: "Everyone plays their own ball. The team's lowest score on each hole counts.",
  aggregate: "Everyone plays their own ball. Every member's score counts on every hole."
};
const FLIGHT_LETTERS = "ABCD";
const isT = () => settings().mode === "tournament";
const isTeamFmt = f => f === "bestball" || f === "aggregate";
const isNum = v => typeof v === "number" && isFinite(v);
function parseHcp(v){
  const t = String(v ?? "").trim();
  if (!t) return null;
  const m = /^([+-]?)(\d{1,2})$/.exec(t);
  if (!m) return undefined;
  return m[1] === "+" ? -(+m[2]) : +m[2];
}
const fmtHcp = h => isNum(h) ? (h < 0 ? "+" + (-h) : String(h)) : "";
/* Hole difficulty order. Works with 1-18 handicaps on 18 holes, 1-9 or odd-only values on 9 holes, and falls back to hole order when a card has none. */
function holeRanks(holes){
  const n = holes.length, hc = holes.map(h => +h.hcp || 0);
  if (!(hc.every(v => v > 0) && new Set(hc).size === n)) return holes.map((_, i) => i + 1);
  const ranks = Array(n);
  hc.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]).forEach(([, i], r) => ranks[i] = r + 1);
  return ranks;
}
/* Strokes a player gets on one hole. Plus handicaps give strokes back on the easiest holes. */
function strokesOn(H, rank, n){
  if (!isNum(H) || H === 0) return 0;
  if (H > 0) return Math.floor(H / n) + (rank <= H % n ? 1 : 0);
  const a = -H;
  return -(Math.floor(a / n) + (n - rank < a % n ? 1 : 0));
}
function scoreBasis(){ return isT() && settings().scoring === "net" ? (S.basis || "net") : "gross"; }
function holeVal(p, i, basis, ranks){
  const g = scoreOf(p, i + 1);
  if (g == null) return null;
  if (basis !== "net") return g;
  const holes = S.round.holes;
  return g - strokesOn(p.hcp, (ranks || holeRanks(holes))[i], holes.length);
}
function sumBasis(p, basis){
  const holes = S.round.holes, ranks = holeRanks(holes);
  let thru = 0, tot = 0, par = 0, gross = 0;
  holes.forEach((h, i) => { const v = holeVal(p, i, basis, ranks); if (v != null){ thru++; tot += v; par += h.par; gross += scoreOf(p, i + 1); } });
  return { ...p, thru, strokes: gross, total: tot, toPar: tot - par };
}
function teamSum(team, members, basis){
  const st = settings(), holes = S.round.holes, ranks = holeRanks(holes);
  const best = st.tFormat === "bestball";
  const k = best ? Math.min(+st.countBest || 1, members.length) : members.length;
  let thru = 0, tot = 0, par = 0;
  if (members.length) holes.forEach((h, i) => {
    const vals = members.map(m => holeVal(m, i, basis, ranks)).filter(v => v != null).sort((a, b) => a - b);
    if (best ? vals.length >= k : vals.length === members.length){ thru++; tot += vals.slice(0, k).reduce((a, b) => a + b, 0); par += h.par * k; }
  });
  return { ...team, members, thru, total: tot, toPar: tot - par };
}
/* The field: who is competing and gets flighted. Teams in best ball and team total, otherwise each scorecard. */
function entrants(){
  const st = settings();
  if (isTeamFmt(st.tFormat)) return st.teams.map(t => {
    const members = S.players.filter(p => p.team === t.id), rated = members.filter(m => isNum(m.hcp));
    return { id: t.id, name: t.name, flight: t.flight, members, isTeam: true, hcp: rated.length ? rated.reduce((a, m) => a + m.hcp, 0) : null };
  });
  return S.players.map(p => ({ id: p.id, name: p.name, flight: p.flight, hcp: isNum(p.hcp) ? p.hcp : null, doc: p }));
}
function flightMap(list){
  const st = settings(), F = +st.flights || 0, m = {};
  if (F < 2) return m;
  if (st.flightBy === "manual"){
    list.forEach(e => m[e.id] = Number.isInteger(e.flight) && e.flight >= 0 && e.flight < F ? e.flight : null);
    return m;
  }
  const rated = list.filter(e => e.hcp != null).sort((a, b) => a.hcp - b.hcp || String(a.name).localeCompare(String(b.name)));
  rated.forEach((e, i) => m[e.id] = Math.floor(i * F / rated.length));
  list.forEach(e => { if (!(e.id in m)) m[e.id] = null; });
  return m;
}
const flightName = f => f == null ? "No flight yet" : "Flight " + FLIGHT_LETTERS[f];
function tStandings(basis){
  if (isTeamFmt(settings().tFormat)) return entrants().map(e => teamSum({ id: e.id, name: e.name, hcp: e.hcp, isTeam: true }, e.members, basis));
  return S.players.map(p => sumBasis(p, basis));
}
function lockFlights(){
  const st = settings(), list = entrants(), fm = flightMap(list);
  if (isTeamFmt(st.tFormat)){
    saveSettings({ flightBy: "manual", teams: st.teams.map(t => ({ ...t, flight: fm[t.id] ?? (Number.isInteger(t.flight) ? t.flight : null) })) });
    return;
  }
  list.forEach(e => { if (fm[e.id] != null && e.flight !== fm[e.id]){ e.doc.flight = fm[e.id]; store.updatePlayer(S.code, e.id, { flight: fm[e.id] }).catch(onWriteError); } });
  saveSettings({ flightBy: "manual" });
}
function cleanMembers(v){ return String(v || "").split(",").map(x => x.trim()).filter(Boolean).slice(0, 8).map(x => x.slice(0, 24)); }

function scorecardHTML(p, holes, cur){
  const showPutts = settings().putts;
  const showNet = isT() && settings().scoring === "net" && isNum(p.hcp), ranks = holeRanks(holes);
  let nRow = '<td class="lbl">Net</td>', totN = 0;
  const n = holes.length, halves = n === 18 ? [[0, 9, "Out"], [9, 18, "In"]] : [[0, n, "Tot"]];
  let hRow = '<th class="lbl">Hole</th>', pRow = '<td class="lbl">Par</td>', sRow = '<td class="lbl">Score</td>', uRow = '<td class="lbl">Putts</td>';
  let totS = 0, totP = 0, totU = 0;
  halves.forEach(([a, b, lab]) => {
    let hs = 0, hp = 0, hu = 0, hn = 0;
    for (let i = a; i < b; i++){
      const v = scoreOf(p, i + 1), par = holes[i].par, isCur = cur === i + 1 ? ' class="cur"' : "";
      const u = puttsOf(p, i + 1), sk = showNet ? strokesOn(p.hcp, ranks[i], n) : 0;
      hp += par; if (v != null) hs += v; if (u != null) hu += u;
      uRow += `<td${isCur}>${u ?? ""}</td>`;
      if (showNet){ if (v != null) hn += v - sk; nRow += `<td${isCur}>${v != null ? v - sk : ""}</td>`; }
      hRow += `<th${isCur}>${i + 1}</th>`; pRow += `<td${isCur}>${par}${sk > 0 ? '<i class="pop" title="Handicap stroke"></i>'.repeat(Math.min(sk, 2)) : ""}</td>`;
      sRow += `<td${isCur}>${v != null ? `<span class="mk ${markClass(v, par)}">${v}</span>` : ""}</td>`;
    }
    totS += hs; totP += hp; totU += hu; totN += hn;
    uRow += `<td class="tot">${hu || ""}</td>`; nRow += `<td class="tot">${hs ? hn : ""}</td>`;
    hRow += `<th class="tot">${lab}</th>`; pRow += `<td class="tot">${hp}</td>`; sRow += `<td class="tot">${hs || ""}</td>`;
  });
  if (n === 18){ hRow += '<th class="tot">Tot</th>'; pRow += `<td class="tot">${totP}</td>`; sRow += `<td class="tot">${totS || ""}</td>`; uRow += `<td class="tot">${totU || ""}</td>`; nRow += `<td class="tot">${totS ? totN : ""}</td>`; }
  return `<div class="scwrap"><table class="sc"><tr>${hRow}</tr><tr>${pRow}</tr><tr>${sRow}</tr>${showNet ? `<tr class="netrow">${nRow}</tr>` : ""}${showPutts ? `<tr>${uRow}</tr>` : ""}</table></div>`;
}

async function doJoin(follow){
  const code = normCode($("#jcode").value), name = $("#jname").value.trim();
  if (code.length < 4) return toast("Enter the sign-up code from your group.");
  let r; try { r = await store.getRound(code); } catch { return toast("Couldn't reach RedGOLF. Check your connection and try again."); }
  if (!r) return toast("No round found for " + code + ". Check the code and try again.");
  if (follow || S.readOnly){ setActive(code, null); go("board"); return; }
  if (r.settings && r.settings.mode === "tournament"){
    let players = [];
    try { players = await store.getPlayers(code); } catch {}
    S.joinStep = { code, round: r, players, name, team: "" };
    go("round");
    return;
  }
  if (!name) return toast("Enter your name so it shows on the leaderboard.");
  const pid = rid("p");
  try { await store.addPlayer(code, pid, { name, scores: {}, joinedAt: Date.now() }); }
  catch (e) { onWriteError(e); setActive(code, null); go("board"); return; }
  setActive(code, pid); go("score"); toast("You're in. Good luck out there.");
}
async function doStart(){
  if (!guard()) return;
  if (S.startType === "tournament") return doStartTournament();
  const c = S.courses.find(x => x.id === $("#scourse").value), me = $("#sme").value.trim();
  const name = $("#sname").value.trim() || (c ? c.name + " round" : "Round");

  if (!me) return toast("Enter your name so it shows on the leaderboard.");
  let code = newCode();
  try { for (let i = 0; i < 4 && await store.getRound(code); i++) code = newCode(); } catch {}
  const pid = rid("p");
  try {
    await store.createRound(code, { name, courseId: c.id, courseName: c.name, tee: c.tee || "", holes: c.holes.map(h => ({ par: h.par, yds: h.yds ?? null, hcp: h.hcp ?? null })), createdAt: Date.now() });
    await store.addPlayer(code, pid, { name: me, scores: {}, joinedAt: Date.now() });
  } catch (e) { return onWriteError(e); }
  ["#sname", "#sme"].forEach(s => { const el = $(s); if (el) el.value = ""; });
  setActive(code, pid); toast("Round started. Share code " + code + " with your group.");
}
async function doStartTournament(){

async function addTeamFresh(code, teamName){

async function joinFinish(kind){
  const J = S.joinStep; if (!J || !guard()) return;
  const st = settingsOf(J.round.settings), f = st.tFormat;
  const hcp = parseHcp($("#jhcp") && $("#jhcp").value);
  if (hcp === undefined) return toast("Enter a handicap like 12, or +2 for a plus handicap.");
  try {
    if (kind === "team"){
      const name = $("#jtname").value.trim();
      if (!name) return toast("Give your team a name.");
      const id = rid("p");
      await store.addPlayer(J.code, id, { name, members: cleanMembers($("#jtmembers").value), hcp, scores: {}, joinedAt: Date.now() });
      S.joinStep = null; setActive(J.code, id); go("score"); toast(name + " is in. Good luck out there.");
      return;
    }
    const name = $("#jname2").value.trim();
    if (!name) return toast("Enter your name so it shows on the leaderboard.");
    let team = null;
    if (isTeamFmt(f)){
      const pick = $("#jteam") ? $("#jteam").value : "";
      if (pick === "__new"){
        const tn = ($("#jnewteam") && $("#jnewteam").value.trim()) || "";
        if (!tn) return toast("Give your new team a name.");
        team = await addTeamFresh(J.code, tn);
      } else team = pick || null;
    }
    const id = rid("p");
    const doc = { name, hcp, scores: {}, joinedAt: Date.now() };
    if (team) doc.team = team;
    await store.addPlayer(J.code, id, doc);
    S.joinStep = null; setActive(J.code, id); go("score"); toast("You're in. Good luck out there.");
  } catch (e) { onWriteError(e); }
}
function saveDraft(){
  if (!guard()) return;
  const d = S.draft;
  if (!d.name.trim()) return toast("Give the course a name.");
  const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : null; };
  const data = { name: d.name.trim(), city: d.city.trim(), tee: d.tee.trim(), notes: d.notes.trim(),
    holes: d.holes.map(h => ({ par: +h.par || 4, yds: num(h.yds), hcp: num(h.hcp) })), updatedAt: Date.now() };
  const id = d.id;

}
async function copyCode(){
  const text = `Join my RedGOLF round "${S.round?.name || ""}" with code ${S.code}`;
  try { await navigator.clipboard.writeText(S.code); toast("Code " + S.code + " copied."); }
  catch {
    const r = document.createRange(), el = $(".codetiles");
    if (el){ r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Press and hold the code to copy it.");
  }
  return text;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a !== "rmplayer" && a !== "delcourse" && a !== "rmteam") S.armed = null;
  switch (a){
    case "tab": go(v); break;
    case "join": doJoin(false); break;
    case "follow": doJoin(true); break;
    case "start": doStart(); break;
    case "copy": copyCode(); break;
    case "share": try { await navigator.share({ title: "RedGOLF", text: `Join my RedGOLF round "${S.round.name}" with code ${S.code}` }); } catch {} break;
    case "leave": leaveRound(false); break;
    case "addplayer": {
      if (!guard()) break;
      const el = $("#addname"), name = el.value.trim();
      if (!name) { toast("Type the player's name first."); break; }
      el.value = "";
      store.addPlayer(S.code, rid("p"), { name, scores: {}, joinedAt: Date.now() }).then(() => toast(name + " added.")).catch(onWriteError);
      break;
    }
    case "rmplayer":
      if (!guard()) break;
      if (S.armed === "rm:" + v){ S.armed = null; store.removePlayer(S.code, v).catch(onWriteError); if (v === S.me) S.me = null; }
      else { S.armed = "rm:" + v; render(); }
      break;
    case "scorer": S.scorer = v; render(); break;
    case "hole": S.hole = +v; render(); break;
    case "plus": case "minus": case "clear": {
      const p = S.players.find(x => x.id === S.scorer) || S.players[0]; if (!p) break;
      const par = S.round.holes[S.hole - 1].par, cur = scoreOf(p, S.hole);
      let nv = a === "clear" ? null : cur == null ? par : cur + (a === "plus" ? 1 : -1);
      if (nv != null) nv = Math.max(1, Math.min(15, nv));
      setScore(p.id, S.hole, nv);
      break;
    }
    case "expand": S.expanded = S.expanded === v ? null : v; render(); break;
    case "boardview": S.boardView = v; S.expanded = null; render(); break;
    case "togglesettings": S.showSettings = !S.showSettings; render(); break;
    case "set": {
      const k = b.dataset.k2;
      if (k === "flightBy" && v === "manual" && settings().flightBy !== "manual"){ if (guard()) lockFlights(); break; }
      saveSettings({ [k]: ["teamCount", "flights", "countBest"].includes(k) ? +v : v });
      break;
    }
    case "starttype": S.startType = v; render(); break;
    case "startopt": { const k = b.dataset.k2; S[k] = k === "startFlights" ? +v : v; render(); break; }
    case "basis": S.basis = v; render(); break;
    case "boardgroup": S.boardGroup = v; S.expanded = null; render(); break;
    case "joincancel": S.joinStep = null; render(); break;
    case "jpick": { const J = S.joinStep; if (!J) break; const t = J.players.find(x => x.id === v); S.joinStep = null; setActive(J.code, v); go("score"); toast("Scoring for " + (t ? t.name : "your team") + "."); break; }
    case "jaddteam": joinFinish("team"); break;
    case "jfinish": joinFinish("player"); break;
    case "taddentrant": {
      if (!guard()) break;
      const st = settings(), nameEl = $("#tAddName"), name = nameEl.value.trim();
      const hcp = parseHcp($("#tAddHcp") && $("#tAddHcp").value);
      if (!name){ toast(st.tFormat === "scramble" ? "Type the team name first." : "Type the player's name first."); break; }
      if (hcp === undefined){ toast("Enter a handicap like 12, or +2 for a plus handicap."); break; }
      const doc = { name, hcp, scores: {}, joinedAt: Date.now() };
      if (st.tFormat === "scramble") doc.members = cleanMembers($("#tAddMembers") && $("#tAddMembers").value);
      ["#tAddName", "#tAddMembers", "#tAddHcp"].forEach(sel => { const el = $(sel); if (el) el.value = ""; });
      store.addPlayer(S.code, rid("p"), doc).then(() => toast(name + " added.")).catch(onWriteError);
      nameEl.focus();
      break;
    }
    case "taddteam": {
      if (!guard()) break;
      const el = $("#tNewTeam"), name = el.value.trim();
      if (!name){ toast("Type the team name first."); break; }
      el.value = "";
      saveSettings({ teams: settings().teams.concat([{ id: rid("tm"), name: name.slice(0, 24), flight: null }]) });
      toast(name + " added. Add its players below the team name.");
      break;
    }
    case "taddmember": {
      if (!guard()) break;
      const el = document.getElementById("tadd-" + v), name = el ? el.value.trim() : "";
      if (!name){ toast("Type the player's name first."); break; }
      el.value = "";
      store.addPlayer(S.code, rid("p"), { name, team: v, hcp: null, scores: {}, joinedAt: Date.now() }).then(() => toast(name + " added.")).catch(onWriteError);
      break;
    }
    case "rmteam": {
      if (!guard()) break;
      if (S.armed !== "rmt:" + v){ S.armed = "rmt:" + v; render(); break; }
      S.armed = null;
      S.players.filter(p => p.team === v).forEach(p => { p.team = null; store.updatePlayer(S.code, p.id, { team: null }).catch(onWriteError); });
      saveSettings({ teams: settings().teams.filter(t => t.id !== v) });
      break;
    }
    case "puttplus": case "puttminus": {
      const p = S.players.find(x => x.id === S.scorer) || S.players[0]; if (!p) break;
      const cur = puttsOf(p, S.hole);
      const nv = Math.max(0, Math.min(10, cur == null ? (a === "puttplus" ? 2 : 1) : cur + (a === "puttplus" ? 1 : -1)));
      setScore(p.id, S.hole, nv, "putts");
      break;
    }
    case "newcourse": if (!guard()) break; S.draft = { id: rid("c"), name: "", city: "", tee: "", notes: "", holes: blankHoles(18) }; S.tab = "courses"; render(); window.scrollTo(0, 0); break;
    case "editcourse": { const c = S.courses.find(x => x.id === v); if (!c) break;
      S.draft = { id: c.id, existing: true, name: c.name || "", city: c.city || "", tee: c.tee || "", notes: c.notes || "", holes: c.holes.map(h => ({ par: h.par, yds: h.yds ?? "", hcp: h.hcp ?? "" })) };
      render(); window.scrollTo(0, 0); break; }
    case "count": { const n = +v, cur = S.draft.holes;
      S.draft.holes = n > cur.length ? cur.concat(blankHoles(n).slice(cur.length)) : cur.slice(0, n); render(); break; }
    case "savecourse": saveDraft(); break;
    case "loadpresets": {
      if (!guard()) break;
      const missing = PRESET_COURSES.filter(pc => !S.courses.some(c => c.id === pc.id));
      b.disabled = true;
      Promise.all(missing.map(({ id, ...c }) => store.saveCourse(id, { ...c, updatedAt: Date.now() })))
        .then(() => toast(missing.length + " courses added."))
        .catch(onWriteError);
      break;
    }
    case "canceldraft": S.draft = null; render(); break;
    case "opencourse": S.courseView = v; render(); window.scrollTo(0, 0); break;
    case "courseback": S.courseView = null; render(); break;
    case "delcourse":
      if (!guard()) break;
      if (S.armed === "del:" + v){ S.armed = null; S.courseView = null; store.deleteCourse(v).then(() => toast("Course deleted.")).catch(onWriteError); render(); }
      else { S.armed = "del:" + v; render(); }
      break;
    case "playhere": S.tab = "round"; render(); { const sel = $("#scourse"); if (sel){ sel.value = v; $("#sname")?.focus(); } } break;
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.draft && S.draft){
    const f = el.dataset.draft;
    if (el.dataset.i != null){
      let val = el.value;
      if (f !== "par") val = val.replace(/\D/g, "");
      S.draft.holes[+el.dataset.i][f] = f === "par" ? +val : val;
      if (f === "par" || f === "yds") { const t = S.draft.holes.reduce((s, h) => s + (+h.par || 0), 0); const y = S.draft.holes.reduce((s, h) => s + (+h.yds || 0), 0);
        const span = document.querySelector(".panel .muted.small"); if (span) span.textContent = "Par " + t + (y ? ", " + y.toLocaleString() + " yds" : ""); }
    } else S.draft[f] = el.value;
  }
  if (el.id === "jcode"){ const pos = el.selectionStart; el.value = normCode(el.value); try { el.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "jteam" && S.joinStep){ S.joinStep.team = el.value; render(); if (el.value === "__new") $("#jnewteam")?.focus(); return; }
  if (!S.code || !S.round) return;
  if (el.id === "scorersel"){ S.scorer = el.value; render(); return; }
  if (el.dataset.hcp){
    if (!guard()) return;
    const h = parseHcp(el.value);
    if (h === undefined){ toast("Enter a handicap like 12, or +2 for a plus handicap."); render(); return; }
    const p = S.players.find(x => x.id === el.dataset.hcp); if (p) p.hcp = h;
    store.updatePlayer(S.code, el.dataset.hcp, { hcp: h }).catch(onWriteError);
    render(); return;
  }
  if (el.dataset.flight){
    if (!guard()) return;
    const fl = el.value === "" ? null : +el.value;
    if (el.dataset.fkind === "team") saveSettings({ teams: settings().teams.map(t => t.id === el.dataset.flight ? { ...t, flight: fl } : t) });
    else { const p = S.players.find(x => x.id === el.dataset.flight); if (p) p.flight = fl; store.updatePlayer(S.code, el.dataset.flight, { flight: fl }).catch(onWriteError); render(); }
    return;
  }
  if (el.dataset.teampick){
    if (!guard() || !el.value) return;
    const p = S.players.find(x => x.id === el.dataset.teampick); if (p) p.team = el.value;
    store.updatePlayer(S.code, el.dataset.teampick, { team: el.value }).catch(onWriteError);
    render(); return;
  }
  if (el.dataset.setting){
    const k = el.dataset.setting;
    saveSettings({ [k]: el.type === "checkbox" ? el.checked : el.value.replace(/[^0-9.]/g, "").slice(0, 6) });
  } else if (el.dataset.teamname != null){
    const names = settings().teamNames.slice(); names[+el.dataset.teamname] = el.value.trim().slice(0, 20) || DEF_SETTINGS.teamNames[+el.dataset.teamname];
    saveSettings({ teamNames: names });
  } else if (el.dataset.team){
    if (!guard()) return;
    const t = el.value === "" ? null : +el.value;
    const p = S.players.find(x => x.id === el.dataset.team); if (p) p.team = t;
    store.setTeam(S.code, el.dataset.team, t).catch(onWriteError);
    render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const id = e.target.id;
  if (id === "jcode" || id === "jname") doJoin(false);
  else if (id === "addname") $('[data-act="addplayer"]')?.click();
  else if (id === "sme" || id === "sname") doStart();
  else if (id === "tAddName" || id === "tAddHcp" || id === "tAddMembers") $('[data-act="taddentrant"]')?.click();
  else if (id === "tNewTeam") $('[data-act="taddteam"]')?.click();
  else if (id.startsWith("tadd-")) document.querySelector(`[data-act="taddmember"][data-v="${id.slice(5)}"]`)?.click();
  else if (/^hcp-/.test(id)) e.target.blur();
});

/* ---------- boot ---------- */
let SETUP_MSG = "";
(async function boot(){
  let db = null;
  const configured = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE");
  const timeout = (p, ms, code) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code }), ms))]);
  const HELP = {
    "auth/admin-restricted-operation": "Anonymous sign-in is turned off. In Firebase, go to Authentication > Sign-in method and turn on Anonymous.",
    "auth/operation-not-allowed": "Anonymous sign-in is turned off. In Firebase, go to Authentication > Sign-in method and turn on Anonymous.",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "The apiKey in FIREBASE_CONFIG is wrong. Copy it again from Firebase Project settings.",
    "auth/invalid-api-key": "The apiKey in FIREBASE_CONFIG is wrong. Copy it again from Firebase Project settings.",
    "auth/unauthorized-domain": "Your Vercel address isn't on Firebase's list. Add it under Authentication > Settings > Authorized domains.",
    "auth/network-request-failed": "No connection to Firebase. Check your internet and reload.",
    "signin-timeout": "Firebase sign-in didn't answer. Check that Anonymous sign-in is on and your Vercel address is under Authorized domains."
  };
  if (configured && window.firebase){
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      await timeout(firebase.auth().signInAnonymously(), 12000, "signin-timeout");
      db = firebase.firestore();
      try { await timeout(db.enablePersistence({ synchronizeTabs: true }), 4000, "skip"); } catch {}
    } catch (e) {
      console.error(e); db = null;
      const code = (e && e.code) || (e && e.message) || "unknown";
      SETUP_MSG = "Couldn't connect to Firebase: " + (HELP[code] || code) + " Until it's fixed, scores stay on this device only.";
    }
  } else {
    SETUP_MSG = configured ? "Couldn't load the database library. Check your connection and reload." : "Setup needed: add your Firebase config to index.html. Until then, scores stay on this device only.";
  }
  window.ggStarted = true;
  store = db ? liveStore(db) : localStore();
  store.watchCourses(list => { S.courses = list.filter(c => Array.isArray(c.holes) && c.holes.length); S.coursesLoaded = true; render(); }, onDbError);
  const saved = ls.get("active");
  if (saved && saved.code && saved.mode === store.mode && store.mode === "live"){ S.code = saved.code; S.me = saved.me; S.scorer = saved.me; watchRound(saved.code); S.tab = "score"; }
  render();
})();
</script>
